[project]
name = "my-voice-studio"
version = "0.1.0"
description = "Công cụ bổ sung quanh VoiceStudio để clone giọng tiếng Việt"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx",
    "librosa",  # speechmos cần librosa và onnxruntime nhưng không khai báo
    "onnxruntime",
    "numpy",
    "pyloudnorm",
    "sea-g2p",
    "sherpa-onnx",
    "sherpa-onnx-core",  # chứa libonnxruntime.dylib mà sherpa-onnx cần
    "soundfile",
    "speechmos",
    "sounddevice>=0.5.6",
    "mlx-whisper>=0.4.3",
]

[tool.uv]
package = false
